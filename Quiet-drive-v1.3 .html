<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Quiet Drive — Prototype</title>

    <style>
        /* ============================== */
        /* GENERAL                        */
        /* ============================== */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #9bc9e4;
            color: #fff;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        }

        canvas {
            display: block;
        }

        /* ============================== */
        /* HUD / GLASS UI                  */
        /* ============================== */
        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .glass {
            background: rgba(18, 30, 42, 0.32);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        #top {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        #brand {
            padding: 10px 14px;
            border-radius: 16px;
        }

        #brand strong {
            display: block;
            font-size: 15px;
            letter-spacing: 0.08em;
        }

        #brand small {
            opacity: 0.75;
            font-size: 11px;
        }

        #stats {
            padding: 10px 13px;
            border-radius: 16px;
            text-align: right;
            min-width: 92px;
        }

        #speed {
            font-size: 26px;
            font-weight: 700;
            line-height: 1;
        }

        #speed small {
            font-size: 11px;
            font-weight: 500;
            opacity: 0.75;
        }

        #location,
        #gear,
        #damage {
            font-size: 11px;
            opacity: 0.78;
            margin-top: 4px;
        }

        #damage {
            font-size: 10px;
        }

        #reverse {
            width: 64px;
            height: 54px;
            border-radius: 18px;
            font-size: 12px;
        }

        /* ============================== */
        /* CONTROL BUTTONS                 */
        /* ============================== */
        #bottom {
            position: absolute;
            left: 14px;
            right: 14px;
            bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .cluster {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            pointer-events: auto;
        }

        .control {
            width: 66px;
            height: 66px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 25px;
            font-weight: 700;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .control:active,
        .control.active {
            background: rgba(255, 255, 255, 0.35);
        }

        .pedal {
            width: 76px;
            height: 88px;
            border-radius: 25px;
            font-size: 13px;
            letter-spacing: 0.04em;
        }

        /* ============================== */
        /* SETTINGS PANEL                  */
        /* ============================== */
        #settings {
            position: absolute;
            right: 14px;
            top: 78px;
            pointer-events: auto;
        }

        #settings button {
            border: 0;
            color: white;
            padding: 10px 13px;
            border-radius: 13px;
            margin-left: 6px;
            font-size: 12px;
        }

        #panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(320px, calc(100vw - 32px));
            padding: 20px;
            border-radius: 22px;
            display: none;
            pointer-events: auto;
        }

        #panel h2 {
            margin: 0 0 12px;
            font-size: 18px;
        }

        #panel label {
            display: block;
            font-size: 12px;
            opacity: 0.85;
            margin: 13px 0 6px;
        }

        #panel select,
        #panel input {
            width: 100%;
            padding: 10px;
            border: 0;
            border-radius: 10px;
            background: #e9f2f7;
            color: #183244;
        }

        #panel button {
            width: 100%;
            margin-top: 14px;
            border: 0;
            padding: 11px;
            border-radius: 12px;
            background: #e5f3ff;
            color: #183244;
            font-weight: 700;
        }

        #hint {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            padding: 10px 14px;
            border-radius: 14px;
            opacity: 1;
            transition: opacity 2s;
            white-space: nowrap;
        }

        #hint.hide {
            opacity: 0;
        }

        @media (min-width: 800px) {
            .control {
                width: 76px;
                height: 76px;
            }

            .pedal {
                width: 90px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <!-- ============================== -->
    <!-- GAME HUD                      -->
    <!-- ============================== -->
    <div id="hud">
        <div id="top">
            <div id="brand" class="glass">
                <strong>QUIET DRIVE</strong>
                <small>open road · prototype</small>
            </div>

            <div id="stats" class="glass">
                <div id="speed">0 <small>km/h</small></div>
                <div id="location">Free roam</div>
                <div id="gear">GEAR: D</div>
                <div id="damage">Vehicle condition: 100%</div>
            </div>
        </div>

        <div id="settings">
            <button class="glass" id="openSettings">☼ Settings</button>
        </div>

        <div id="hint" class="glass">
            DRIVE chạy · R số lùi · giữ ◀ ▶ để lái · BRAKE phanh
        </div>

        <div id="bottom">
            <div class="cluster">
                <div class="control glass" id="left">◀</div>
                <div class="control glass" id="right">▶</div>
            </div>

            <div class="cluster">
                <div class="control pedal glass" id="brake">BRAKE</div>
                <div class="control pedal glass" id="gas">DRIVE</div>
                <div class="control glass" id="reverse">R</div>
            </div>
        </div>

        <div id="panel" class="glass">
            <h2>Drive settings</h2>

            <label for="environment">Environment</label>
            <select id="environment">
                <option value="sunset">Golden hour</option>
                <option value="day">Daylight</option>
                <option value="night">Night</option>
                <option value="rain">Rainy mood</option>
            </select>

            <label for="assist">Driving assist</label>
            <select id="assist">
                <option value="on">Relaxed steering</option>
                <option value="off">More responsive</option>
            </select>

            <button id="closeSettings">Continue driving</button>
        </div>
    </div>

    <!-- ============================== -->
    <!-- THREE.JS GAME                  -->
    <!-- ============================== -->
    <script type="module">
        import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

        // ------------------------------
        // SCENE, CAMERA AND RENDERER
        // ------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x9dcce7);
        scene.fog = new THREE.Fog(0x9dcce7, 70, 300);

        const camera = new THREE.PerspectiveCamera(
            68,
            window.innerWidth / window.innerHeight,
            0.1,
            600
        );
        camera.position.set(0, 5, 10);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        document.body.appendChild(renderer.domElement);

        // ------------------------------
        // LIGHTING
        // ------------------------------
        const hemisphereLight = new THREE.HemisphereLight(
            0xe3f4ff,
            0x58624c,
            2.0
        );
        scene.add(hemisphereLight);

        const sunLight = new THREE.DirectionalLight(0xffe0b0, 3.1);
        sunLight.position.set(-35, 60, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.set(1024, 1024);
        scene.add(sunLight);

        // ------------------------------
        // MATERIALS AND GROUND
        // ------------------------------
        function createMaterial(color, roughness = 0.85) {
            return new THREE.MeshStandardMaterial({
                color,
                roughness
            });
        }

        const grassMaterial = createMaterial(0x6f9c75);
        const roadMaterial = createMaterial(0x333941);
        const sidewalkMaterial = createMaterial(0xb9b8ad);
        const roadLineMaterial = createMaterial(0xe8e3cf);
        const treeMaterial = createMaterial(0x477e58);
        const trunkMaterial = createMaterial(0x72503a);

        const buildingColors = [
            0xc9bda9,
            0x8eaaa8,
            0xd4c7b5,
            0x9cabb7,
            0xb4c1a6
        ];

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(500, 500),
            grassMaterial
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.06;
        ground.receiveShadow = true;
        scene.add(ground);

        // ------------------------------
        // ROAD GRID
        // ------------------------------
        function createRoadStrip(width, length, material, x, z) {
            const roadStrip = new THREE.Mesh(
                new THREE.BoxGeometry(width, 0.08, length),
                material
            );
            roadStrip.position.set(x, 0.02, z);
            roadStrip.receiveShadow = true;
            scene.add(roadStrip);
            return roadStrip;
        }

        // Main north-south roads
        createRoadStrip(16, 460, roadMaterial, 0, 0);
        createRoadStrip(16, 460, roadMaterial, 70, 0);
        createRoadStrip(16, 460, roadMaterial, -70, 0);

        // Main east-west roads
        createRoadStrip(460, 16, roadMaterial, 0, 0);
        createRoadStrip(460, 16, roadMaterial, 0, 70);
        createRoadStrip(460, 16, roadMaterial, 0, -70);

        // Sidewalks
        for (const x of [-9, 9, 61, 79, -79, -61]) {
            createRoadStrip(2, 460, sidewalkMaterial, x, 0);
        }

        for (const z of [-9, 9, 61, 79, -79, -61]) {
            createRoadStrip(460, 2, sidewalkMaterial, 0, z);
        }

        // Dashed lane markings
        for (let z = -220; z < 220; z += 13) {
            const dash = new THREE.Mesh(
                new THREE.BoxGeometry(0.24, 0.09, 5),
                roadLineMaterial
            );
            dash.position.set(0, 0.09, z);
            scene.add(dash);

            const rightDash = dash.clone();
            rightDash.position.x = 70;
            scene.add(rightDash);

            const leftDash = dash.clone();
            leftDash.position.x = -70;
            scene.add(leftDash);
        }

        for (let x = -220; x < 220; x += 13) {
            const dash = new THREE.Mesh(
                new THREE.BoxGeometry(5, 0.09, 0.24),
                roadLineMaterial
            );
            dash.position.set(x, 0.09, 0);
            scene.add(dash);
        }

        // ------------------------------
        // BUILDINGS AND COLLISION DATA
        // ------------------------------
        const obstacles = [];

        function createBuilding(x, z, width, depth, height, color) {
            const building = new THREE.Mesh(
                new THREE.BoxGeometry(width, height, depth),
                createMaterial(color, 0.75)
            );
            building.position.set(x, height / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);

            // Add a simple rooftop
            const roof = new THREE.Mesh(
                new THREE.BoxGeometry(width * 1.03, 0.18, depth * 1.03),
                createMaterial(0x77766f)
            );
            roof.position.set(x, height + 0.08, z);
            scene.add(roof);

            // Store a simplified collision circle around the building
            obstacles.push({
                x,
                z,
                radius: Math.sqrt(width * width + depth * depth) * 0.48,
                type: "building"
            });

            // Basic facade windows
            const windowMaterial = new THREE.MeshStandardMaterial({
                color: 0x8bb8c8,
                roughness: 0.3,
                metalness: 0.15
            });

            for (let y = 2.3; y < height - 1; y += 3.3) {
                for (let offsetX = -width / 2 + 1.3; offsetX < width / 2 - 1; offsetX += 2.8) {
                    const windowMesh = new THREE.Mesh(
                        new THREE.BoxGeometry(0.95, 1.25, 0.06),
                        windowMaterial
                    );
                    windowMesh.position.set(
                        x + offsetX,
                        y,
                        z + depth / 2 + 0.04
                    );
                    scene.add(windowMesh);
                }
            }
        }

        // Generate city blocks while leaving room for roads
        for (let blockX = -200; blockX <= 200; blockX += 28) {
            for (let blockZ = -200; blockZ <= 200; blockZ += 28) {
                const nearRoadX =
                    Math.abs(blockX) < 18 ||
                    Math.abs(blockX - 70) < 18 ||
                    Math.abs(blockX + 70) < 18;

                const nearRoadZ =
                    Math.abs(blockZ) < 18 ||
                    Math.abs(blockZ - 70) < 18 ||
                    Math.abs(blockZ + 70) < 18;

                if (nearRoadX || nearRoadZ) continue;
                if (Math.random() < 0.13) continue;

                const width = 12 + Math.random() * 10;
                const depth = 12 + Math.random() * 10;
                const height = 7 + Math.random() * 30;
                const color = buildingColors[
                    Math.floor(Math.random() * buildingColors.length)
                ];

                createBuilding(
                    blockX + (Math.random() - 0.5) * 5,
                    blockZ + (Math.random() - 0.5) * 5,
                    width,
                    depth,
                    height,
                    color
                );
            }
        }

        // ------------------------------
        // TREES
        // ------------------------------
        function createTree(x, z) {
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.22, 0.35, 2.4, 7),
                trunkMaterial
            );
            trunk.position.set(x, 1.2, z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leaves = new THREE.Mesh(
                new THREE.SphereGeometry(1.5, 8, 7),
                treeMaterial
            );
            leaves.position.set(x, 3, z);
            leaves.castShadow = true;
            scene.add(leaves);

            obstacles.push({
                x,
                z,
                radius: 1.55,
                type: "tree"
            });
        }

        for (let z = -220; z < 220; z += 12) {
            createTree(13, z);
            createTree(-13, z);
            createTree(83, z);
            createTree(-83, z);
        }

        for (let x = -220; x < 220; x += 12) {
            createTree(x, 13);
            createTree(x, -13);
            createTree(x, 83);
            createTree(x, -83);
        }

        // ------------------------------
        // MOUNTAIN BORDER
        // ------------------------------
        const mountainMaterial = createMaterial(0x607e65);
        const mountainTopMaterial = createMaterial(0x8ca58a);

        for (let index = 0; index < 32; index++) {
            const angle = (index / 32) * Math.PI * 2;
            const radius = 226 + Math.random() * 8;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const height = 24 + Math.random() * 26;
            const hillRadius = 18 + Math.random() * 12;

            const hill = new THREE.Mesh(
                new THREE.ConeGeometry(hillRadius, height, 7),
                mountainMaterial
            );
            hill.position.set(x, height / 2 - 1, z);
            hill.rotation.y = Math.random() * Math.PI;
            hill.castShadow = true;
            scene.add(hill);

            const hillTop = new THREE.Mesh(
                new THREE.ConeGeometry(hillRadius * 0.55, height * 0.25, 7),
                mountainTopMaterial
            );
            hillTop.position.set(x, height * 0.84, z);
            hillTop.rotation.y = hill.rotation.y;
            scene.add(hillTop);
        }

        // ------------------------------
        // PLAYER CAR
        // ------------------------------
        const car = new THREE.Group();
        scene.add(car);

        const carBodyMaterial = createMaterial(0xd8e4e9, 0.34);
        const darkMaterial = createMaterial(0x17212a, 0.42);
        const glassMaterial = new THREE.MeshStandardMaterial({
            color: 0x28485a,
            roughness: 0.25,
            metalness: 0.15
        });

        const chassis = new THREE.Mesh(
            new THREE.BoxGeometry(2.05, 0.62, 4.15),
            carBodyMaterial
        );
        chassis.position.y = 0.75;
        chassis.castShadow = true;
        car.add(chassis);

        const cabin = new THREE.Mesh(
            new THREE.BoxGeometry(1.58, 0.85, 2.05),
            glassMaterial
        );
        cabin.position.set(0, 1.38, -0.25);
        cabin.castShadow = true;
        car.add(cabin);

        const roof = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 0.12, 1.75),
            carBodyMaterial
        );
        roof.position.set(0, 1.83, -0.28);
        car.add(roof);

        const hood = new THREE.Mesh(
            new THREE.BoxGeometry(1.85, 0.18, 1.15),
            carBodyMaterial
        );
        hood.position.set(0, 1.02, -1.45);
        car.add(hood);

        const bumper = new THREE.Mesh(
            new THREE.BoxGeometry(2.05, 0.25, 0.2),
            darkMaterial
        );
        bumper.position.set(0, 0.48, -2.08);
        car.add(bumper);
        
        // ------------------------------
        // WHEELS AND WHEEL HUBS
        // ------------------------------
        const wheels = [];
        const wheelMaterial = darkMaterial;
        const hubMaterial = createMaterial(0x9daab0, 0.35);

        for (const x of [-0.78, 0.78]) {
            for (const z of [-1.7, 1.45]) {
                const wheel = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.43, 0.43, 0.28, 16),
                    wheelMaterial
                );
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(x, 0.48, z);
                wheel.castShadow = true;
                car.add(wheel);
                wheels.push(wheel);

                const hub = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.19, 0.19, 0.3, 12),
                    hubMaterial
                );
                hub.rotation.z = Math.PI / 2;
                hub.position.set(x, 0.48, z);
                car.add(hub);
            }
        }

        // ------------------------------
        // HEADLIGHTS AND TAILLIGHTS
        // ------------------------------
        const headlightMaterial = new THREE.MeshStandardMaterial({
            color: 0xfff3d0,
            emissive: 0xffe4a0,
            emissiveIntensity: 0.3
        });
        const taillightMaterial = new THREE.MeshStandardMaterial({
            color: 0x8c2020,
            emissive: 0x550000,
            emissiveIntensity: 0.25
        });

        for (const x of [-0.65, 0.65]) {
            const headlight = new THREE.Mesh(
                new THREE.BoxGeometry(0.4, 0.18, 0.08),
                headlightMaterial
            );
            headlight.position.set(x, 0.88, -2.12);
            car.add(headlight);

            const taillight = new THREE.Mesh(
                new THREE.BoxGeometry(0.35, 0.18, 0.08),
                taillightMaterial
            );
            taillight.position.set(x, 0.88, 2.12);
            car.add(taillight);
        }

        // ------------------------------
        // INPUT CONTROLS
        // ------------------------------
        const keys = {
            left: false,
            right: false,
            gas: false,
            brake: false
        };

        function bindHoldButton(elementId, inputName) {
            const button = document.getElementById(elementId);

            function press(event) {
                event.preventDefault();
                keys[inputName] = true;
                button.classList.add("active");
            }

            function release(event) {
                event.preventDefault();
                keys[inputName] = false;
                button.classList.remove("active");
            }

            button.addEventListener("pointerdown", press);
            button.addEventListener("pointerup", release);
            button.addEventListener("pointercancel", release);
            button.addEventListener("pointerleave", release);
        }

        bindHoldButton("left", "left");
        bindHoldButton("right", "right");
        bindHoldButton("gas", "gas");
        bindHoldButton("brake", "brake");

        window.addEventListener("keydown", (event) => {
            if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") keys.left = true;
            if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") keys.right = true;
            if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") keys.gas = true;
            if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") keys.brake = true;
        });

        window.addEventListener("keyup", (event) => {
            if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") keys.left = false;
            if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") keys.right = false;
            if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") keys.gas = false;
            if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") keys.brake = false;
        });

        // ------------------------------
        // REVERSE GEAR
        // ------------------------------
        let reverseGear = false;
        const reverseButton = document.getElementById("reverse");
        const gearDisplay = document.getElementById("gear");

        reverseButton.addEventListener("click", () => {
            if (Math.abs(speed) > 0.8) return;
            reverseGear = !reverseGear;
            gearDisplay.textContent = reverseGear ? "GEAR: R" : "GEAR: D";
            reverseButton.classList.toggle("active", reverseGear);
        });

        // ------------------------------
        // SETTINGS / ENVIRONMENT
        // ------------------------------
        const settingsPanel = document.getElementById("panel");
        document.getElementById("openSettings").addEventListener("click", () => {
            settingsPanel.style.display = "block";
        });
        document.getElementById("closeSettings").addEventListener("click", () => {
            settingsPanel.style.display = "none";
        });

        let currentEnvironment = "sunset";
        let isRainy = false;

        function applyEnvironment(environment) {
            currentEnvironment = environment;

            const presets = {
                day: {
                    sky: 0x9bcde9,
                    fog: 0x9bcde9,
                    sun: 3.5,
                    ambient: 2.2,
                    sunColor: 0xffffff,
                    exposure: 1.2
                },
                sunset: {
                    sky: 0xe6b88d,
                    fog: 0xe6b88d,
                    sun: 2.8,
                    ambient: 1.5,
                    sunColor: 0xffb86b,
                    exposure: 1.1
                },
                night: {
                    sky: 0x101c32,
                    fog: 0x101c32,
                    sun: 0.18,
                    ambient: 0.45,
                    sunColor: 0x9bbcff,
                    exposure: 0.85
                },
                rain: {
                    sky: 0x627b91,
                    fog: 0x627b91,
                    sun: 1.2,
                    ambient: 1.15,
                    sunColor: 0xb8c8d8,
                    exposure: 0.95
                }
            };

            const preset = presets[environment] || presets.sunset;
            scene.background.set(preset.sky);
            scene.fog.color.set(preset.fog);
            sunLight.intensity = preset.sun;
            hemisphereLight.intensity = preset.ambient;
            sunLight.color.set(preset.sunColor);
            renderer.toneMappingExposure = preset.exposure;
            isRainy = environment === "rain";
        }

        document.getElementById("environment").addEventListener("change", (event) => {
            applyEnvironment(event.target.value);
        });
        applyEnvironment("sunset");

        // ------------------------------
        // VEHICLE PHYSICS
        // ------------------------------
        let speed = 0; // meters per second; negative means reverse
        let steering = 0;
        let heading = 0;
        let damage = 0;
        let collisionCooldown = 0;

        const acceleration = 8.5;
        const reverseAcceleration = 5.2;
        const brakingForce = 18;
        const forwardSpeedLimit = 25;
        const reverseSpeedLimit = 8;
        const vehicleCollisionRadius = 1.45;
        const worldLimit = 208;

        const bodyParts = [chassis, hood, roof];
        const originalBodyColor = 0xd8e4e9;

        function updateDamage(amount) {
            damage = Math.min(100, damage + amount);
            const condition = 100 - damage;
            document.getElementById("damage").textContent =
                `Vehicle condition: ${Math.round(condition)}%`;

            const damagedColor = new THREE.Color(originalBodyColor);
            damagedColor.lerp(new THREE.Color(0x6b4540), damage / 100 * 0.65);
            carBodyMaterial.color.copy(damagedColor);
        }

        function checkObstacleCollision() {
            for (const obstacle of obstacles) {
                const dx = car.position.x - obstacle.x;
                const dz = car.position.z - obstacle.z;
                const distance = Math.sqrt(dx * dx + dz * dz);
                const minimumDistance = obstacle.radius + vehicleCollisionRadius;

                if (distance < minimumDistance) {
                    const normalX = distance > 0.001 ? dx / distance : 1;
                    const normalZ = distance > 0.001 ? dz / distance : 0;

                    // Push the car back outside the obstacle.
                    car.position.x = obstacle.x + normalX * minimumDistance;
                    car.position.z = obstacle.z + normalZ * minimumDistance;

                    // Lose speed and apply a small bounce.
                    speed *= -0.18;

                    if (collisionCooldown <= 0) {
                        const impact = Math.min(12, Math.max(2, Math.abs(speed) * 1.1));
                        updateDamage(impact);
                        collisionCooldown = 0.65;
                    }
                    return true;
                }
            }
            return false;
        }

        function keepInsideWorld() {
            const distanceFromCenter = Math.hypot(car.position.x, car.position.z);
            if (distanceFromCenter > worldLimit) {
                const scale = worldLimit / distanceFromCenter;
                car.position.x *= scale;
                car.position.z *= scale;
                speed *= -0.2;

                if (collisionCooldown <= 0) {
                    updateDamage(3);
                    collisionCooldown = 0.65;
                }
            }
        }

        function updateVehicle(deltaTime) {
            const relaxedSteering = document.getElementById("assist").value === "on";
            const driveDirection = reverseGear ? -1 : 1;

            if (keys.gas) {
                if (reverseGear) {
                    speed = Math.max(speed - reverseAcceleration * deltaTime, -reverseSpeedLimit);
                } else {
                    speed = Math.min(speed + acceleration * deltaTime, forwardSpeedLimit);
                }
            } else {
                // Gentle rolling resistance when no pedal is pressed.
                speed *= Math.pow(0.992, deltaTime * 60);
                if (Math.abs(speed) < 0.06) speed = 0;
            }

            if (keys.brake) {
                if (speed > 0) {
                    speed = Math.max(0, speed - brakingForce * deltaTime);
                } else if (speed < 0) {
                    speed = Math.min(0, speed + brakingForce * deltaTime);
                }
            }

            const steeringTarget = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
            steering = THREE.MathUtils.lerp(steering, steeringTarget, deltaTime * 5.5);

            // Steering response scales with speed and reverses naturally in reverse gear.
            const speedFactor = THREE.MathUtils.clamp(Math.abs(speed) / 7, 0.18, 1.2);
            const steeringRate = relaxedSteering ? 1.05 : 1.45;
            heading += steering * steeringRate * speedFactor * driveDirection * deltaTime;

            const forward = new THREE.Vector3(
                Math.sin(heading),
                0,
                -Math.cos(heading)
            );
            car.position.addScaledVector(forward, speed * deltaTime);
            car.rotation.y = heading;

            // Spin the wheels based on distance traveled.
            for (const wheel of wheels) {
                wheel.rotation.x += speed * deltaTime * 2.2;
            }

            checkObstacleCollision();
            keepInsideWorld();

            collisionCooldown = Math.max(0, collisionCooldown - deltaTime);
            document.getElementById("speed").innerHTML =
                `${Math.round(Math.abs(speed) * 3.6)} <small>km/h</small>`;
        }

        // ------------------------------
        // FOLLOW CAMERA
        // ------------------------------
        function updateCamera(deltaTime) {
            const cameraOffset = new THREE.Vector3(0, 4.3, 9.5)
                .applyAxisAngle(new THREE.Vector3(0, 1, 0), heading);
            const desiredPosition = car.position.clone().add(cameraOffset);

            const smoothFactor = 1 - Math.pow(0.001, deltaTime);
            camera.position.lerp(desiredPosition, smoothFactor);
            camera.lookAt(car.position.clone().add(new THREE.Vector3(0, 1.1, 0)));
        }

        // ------------------------------
        // MAIN GAME LOOP
        // ------------------------------
        let previousFrameTime = performance.now();

        function gameLoop(now) {
            requestAnimationFrame(gameLoop);
            const deltaTime = Math.min((now - previousFrameTime) / 1000, 0.04);
            previousFrameTime = now;

            updateVehicle(deltaTime);
            updateCamera(deltaTime);
            renderer.render(scene, camera);
        }

        requestAnimationFrame(gameLoop);

        // ------------------------------
        // RESIZE HANDLING
        // ------------------------------
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.7));
        });

        // Hide the onboarding hint after a few seconds.
        window.setTimeout(() => {
            document.getElementById("hint").classList.add("hide");
        }, 6500);
    </script>
</body>
</html>
